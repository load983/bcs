<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>বিজ্ঞান ডায়াগ্রাম স্টুডিও</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--fg:#16302b;--cd:#fff;--bd:#c9d8d3;--ac:#0f766e;--ab:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1917;--fg:#e2f0ec;--cd:#162622;--bd:#2a4540;--ac:#4fd1c0;--ab:#06201c}}
:root[data-theme=dark]{--bg:#0e1917;--fg:#e2f0ec;--cd:#162622;--bd:#2a4540;--ac:#4fd1c0;--ab:#06201c}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:15px 'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif}
header{padding:8px 12px 2px;display:flex;align-items:baseline;gap:8px;flex:none}
h1{font-size:19px;margin:0;font-weight:600}
header small{opacity:.65;font-size:12px}
.row{display:flex;gap:6px;overflow-x:auto;padding:5px 10px;flex:none;align-items:center;scrollbar-width:none}
button,label.b{font:inherit;color:var(--fg);background:var(--cd);border:1px solid var(--bd);border-radius:9px;padding:6px 10px;white-space:nowrap;cursor:pointer;flex:none}
button.on{background:var(--ac);color:var(--ab);border-color:var(--ac)}
button:focus-visible,label.b:focus-within{outline:2px solid var(--ac);outline-offset:1px}
#sj button{flex:1;font-weight:600;padding:8px 6px}
input[type=color]{width:34px;height:32px;padding:0;border:1px solid var(--bd);border-radius:8px;background:none;flex:none}
#cv{flex:1;min-height:0;margin:2px 10px;border:1px solid var(--bd);border-radius:12px;background:#fff;overflow:hidden;position:relative;box-shadow:0 4px 18px rgba(0,0,0,.06)}
#s{cursor:grab}#s.dragging{cursor:grabbing}#s.erasing{cursor:crosshair}.hint{position:absolute;right:10px;bottom:10px;background:rgba(22,48,43,.82);color:#fff;border-radius:10px;padding:5px 9px;font-size:11px;pointer-events:none}
#s{width:100%;height:100%;touch-action:none;display:block}
#st{padding-bottom:8px}
.st{width:74px;padding:4px 2px;font-size:11px;white-space:normal;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:2px}
.st svg{width:44px;height:44px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#ov[hidden]{display:none}
#ov div{background:var(--cd);border-radius:12px;padding:12px;max-width:520px;text-align:center}
#ov img{max-width:100%;max-height:55vh;border:1px solid var(--bd);background:#fff}
#ov a{color:var(--ac)}
#gn input{font:inherit;color:var(--fg);background:var(--cd);border:1px solid var(--bd);border-radius:9px;padding:6px 9px;flex:none}#msg{font-size:12px;opacity:.8;white-space:nowrap}
#gp{margin:2px 10px;padding:8px;border:1px solid var(--bd);border-radius:12px;background:var(--cd);display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:none;max-height:36vh;overflow:auto}
#gp[hidden],#go[hidden]{display:none}
#gp textarea,#gp input[type=text],#gp input[type=number]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:6px 9px}
#gq{flex:1 1 260px;min-height:44px;resize:vertical}
#go{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex-basis:100%}
#go input[type=number],#go input[type=text]{width:84px}
.gl{display:flex;align-items:center;gap:5px;font-size:12px}
.chip{padding:3px 10px;font-size:12px;border-radius:99px}
.rx-panel{margin:3px 10px;padding:11px 13px;border:1px solid var(--bd);border-radius:14px;background:linear-gradient(135deg,var(--cd),color-mix(in srgb,var(--ac) 7%,var(--cd)));box-shadow:0 4px 16px rgba(0,0,0,.05);flex:none;max-height:34vh;overflow:auto}
.rx-heading{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}.rx-heading b{font-size:14px;color:var(--ac)}.rx-heading span,.rx-presets>span{font-size:11px;opacity:.7}
.rx-grid{display:grid;grid-template-columns:minmax(140px,1fr) minmax(110px,.65fr) minmax(110px,.65fr) minmax(140px,1fr) auto auto;gap:7px;align-items:end}
.rx-grid label{display:grid;gap:3px;font-size:11px;opacity:.82}.rx-grid input,.rx-grid select{width:100%;min-width:0;height:34px;padding:5px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}.rx-grid button{height:34px;background:var(--ac);color:var(--ab);border-color:var(--ac)}
.rx-presets{display:flex;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap}.rx-presets button{padding:2px 9px;font-size:11px}
@media(max-width:760px){.rx-panel{max-height:31vh;padding:8px}.rx-heading{align-items:flex-start;flex-direction:column;gap:0}.rx-grid{grid-template-columns:1fr 1fr}.rx-grid label:first-child,.rx-grid label:nth-child(4){grid-column:span 2}.rx-grid .rx-condition{grid-column:span 1}.rx-presets{margin-top:6px}}
@media(prefers-reduced-motion:no-preference){.rx-panel{animation:rx-in .18s ease-out}@keyframes rx-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}}

[hidden]{display:none!important}
header{position:sticky;top:0;z-index:3;background:var(--bg)}
button,label.b{transition:background .15s,border-color .15s,transform .05s}
button:hover:not(.on){border-color:var(--ac)}button:active{transform:scale(.97)}
.sep{width:1px;align-self:stretch;background:var(--bd);margin:2px 3px;flex:none}
@media(min-width:760px){#tl,#ac,#sr,#ob,#gn{flex-wrap:wrap;overflow:visible}}
.gl input[type=range],#tx input[type=range]{accent-color:var(--ac)}
.gl output{min-width:34px;font-size:11px;opacity:.75}
.sw{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid var(--bd)}
.sw.on{outline:2px solid var(--ac);outline-offset:2px}
#bgp{margin:2px 10px;padding:7px 9px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);display:flex;flex-wrap:wrap;gap:7px;align-items:center;flex:none}
#bgs{display:flex;gap:6px;flex-wrap:wrap}
#tx{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.tp{pointer-events:auto;background:var(--cd);color:var(--fg);width:min(680px,100%);max-height:62vh;overflow:auto;border:1px solid var(--bd);border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;box-shadow:0 -8px 28px rgba(0,0,0,.25)}
.th{display:flex;align-items:center;gap:6px}.th span{margin-left:auto;display:flex;gap:6px}
.tp textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px;resize:vertical;min-height:64px}
.tr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tr select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:5px 6px}
.sy{max-height:84px;overflow:auto;gap:4px}.sy button{padding:3px 9px;min-width:34px}
#gdv{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:10px}
.gb{background:var(--cd);color:var(--fg);width:min(780px,100%);max-height:94vh;border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.gh{display:flex;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd)}.gh span{margin-left:auto;display:flex;gap:6px}
.gc{overflow:auto;padding:2px 16px 18px;line-height:1.6;font-size:14px}
.gc h3{margin:16px 0 4px;color:var(--ac);font-size:15px}.gc ul{margin:0;padding-left:20px}.gc li{margin:3px 0}
.gc kbd{background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:0 5px;font-size:12px}
</style></head><body>
<header><h1>বিজ্ঞান ডায়াগ্রাম স্টুডিও</h1><small>পদার্থ · গণিত · রসায়ন</small><button id="hb" style="margin-left:auto" title="সব অপশনের ব্যাখ্যা">❓ গাইড</button><button id="lg" aria-label="Language">English</button></header>
<div class="row" id="sj"></div>
<div class="row" id="tl"></div>
<div class="row" id="ac">
 <button id="un" title="শেষ কাজ ফিরিয়ে নিন (Ctrl+Z)">↶ আগে</button><button id="rd" title="আবার করুন (Ctrl+Y)">↷ পরে</button><span class="sep"></span>
 <button id="zo" title="জুম কমান">🔍−</button><button id="zi" title="জুম বাড়ান">🔍＋</button><button id="ft" title="সব ডায়াগ্রাম পর্দায় ফিট">⤢ ফিট</button>
 <button id="gv" class="on" title="স্ক্রিনে জাল দেখান/লুকান (ছবিতে জাল যায় না)">▦ জাল</button><button id="sn" title="আঁকার সময় জালের ঘরে বসে যাবে">🧲 জালে বসান</button>
 <button id="bgb" title="ক্যানভাসের ব্যাকগ্রাউন্ড রং">🖼 ব্যাকগ্রাউন্ড</button><span class="sep"></span>
 <button id="mu" title="একাধিক বস্তু নির্বাচন: ট্যাপ/ক্লিকে যোগ-বাদ, ফাঁকা জায়গায় টেনে বক্স নির্বাচন">☑ বহু-নির্বাচন</button><button id="sa" title="সব বস্তু নির্বাচন (Ctrl+A)">সব নির্বাচন</button><span class="sep"></span>
 <button id="pj" title="প্রকল্প ফাইল (.json) হিসেবে সংরক্ষণ">💾 সংরক্ষণ</button><label class="b" title="সংরক্ষিত প্রকল্প ফাইল খুলুন">📂 খুলুন<input type="file" id="po" accept=".json,application/json" hidden></label><span class="sep"></span>
 <button id="ep" title="ছবি (PNG) হিসেবে নিন">PNG</button><button id="es" title="ভেক্টর ছবি (SVG) হিসেবে নিন">SVG</button><button id="uq2" class="on" hidden>✅ প্রশ্নে যুক্ত করুন</button>
 <button id="cl" title="ক্যানভাস খালি করুন">🗑 সব মুছুন</button>
</div>
<div class="row" id="al" hidden>
 <b style="font-size:12px">সাজান</b>
 <button data-a="l" title="বামে সারিবদ্ধ">⇤ বাম</button><button data-a="c" title="অনুভূমিক মাঝে">⇔ মাঝ</button><button data-a="r" title="ডানে সারিবদ্ধ">⇥ ডান</button><span class="sep"></span>
 <button data-a="t" title="উপরে সারিবদ্ধ">⤒ উপর</button><button data-a="m" title="উল্লম্ব মাঝে">⇕ মাঝ</button><button data-a="b" title="নিচে সারিবদ্ধ">⤓ নিচ</button><span class="sep"></span>
 <button data-a="dh" title="অনুভূমিকভাবে সমান ফাঁক">↔ সমান ফাঁক</button><button data-a="dv" title="উল্লম্বভাবে সমান ফাঁক">↕ সমান ফাঁক</button>
</div>
<div id="bgp" hidden>
 <b style="font-size:13px">ব্যাকগ্রাউন্ড রং</b><div id="bgs"></div>
 <label class="gl" title="নিজের পছন্দের রং"><input type="color" id="bgc" value="#ffffff" aria-label="ব্যাকগ্রাউন্ড রং"></label>
 <label class="gl" title="ছবিতে কোনো ব্যাকগ্রাউন্ড থাকবে না (PNG স্বচ্ছ হবে)"><input type="checkbox" id="bgt"> স্বচ্ছ</label>
</div>
<div class="row" id="sr">
 <label class="gl" title="লাইন / লেখার রং">রং <input type="color" id="col" value="#111111" aria-label="রং"></label>
 <label class="gl" title="লাইনের মোটা">মোটা <input type="range" id="wd" min="1" max="12" value="3" aria-label="মোটা" style="width:90px"></label>
</div>
<div class="row" id="ob" hidden>
 <label class="gl" title="নির্বাচিত বস্তুর আকার">আকার <input type="range" id="sz" min="0.2" max="8" step="0.05" value="1" style="width:84px"></label>
 <label class="gl" title="ঘোরানো (ডিগ্রি)">ঘূর্ণন <input type="range" id="rt" min="0" max="359" step="1" value="0" style="width:84px"><output id="rtv">0°</output></label><button id="ro" title="৯০° ঘোরান">⟳ 90°</button>
 <label class="gl" title="স্বচ্ছতা">স্বচ্ছতা <input type="range" id="op" min="10" max="100" step="5" value="100" style="width:70px"></label><span class="sep"></span>
 <label class="gl" id="fcl" title="ভরাটের রং"><input type="color" id="fc" value="#fff3b0"></label><button id="fl" title="নির্বাচিত আকৃতি রং দিয়ে ভরাট/খালি">🎨 ভরাট</button>
 <button id="ds" title="রেখা ডটেড/সলিড">┄ ডট রেখা</button><button id="fx" title="আয়নার মতো উল্টান">⇋ উল্টান</button><span class="sep"></span>
 <button id="fr" title="সামনে আনুন">⬆ সামনে</button><button id="bk" title="পেছনে পাঠান">⬇ পেছনে</button><button id="du" title="কপি (Ctrl+D)">⧉ কপি</button><button id="de" title="মুছুন (Delete)">🗑 মুছুন</button>
 <button id="lk" title="টেনে সরানো ও ছোট-বড় করা বন্ধ/চালু">🔒 লক</button><button id="te" class="on" hidden title="লেখা সম্পাদনা করুন">✎ লেখা বদলান</button>
</div>
<div class="row" id="gn"><input id="smi" placeholder="🧪 যৌগের নাম/SMILES: aspirin, CCO" style="width:210px"><button id="gm">যৌগ আঁকুন</button><button id="rxtog" aria-expanded="false">⚗️ বিক্রিয়া সাজান</button><button id="gtog" aria-expanded="false">📈 গ্রাফ</button><span id="msg" role="status" aria-live="polite"></span></div>
<div id="rxp" class="rx-panel" hidden>
 <div class="rx-heading"><b>⚗️ বিক্রিয়া চিত্র নির্মাতা</b><span>সমীকরণটি নিজে লিখুন; স্টুডিও সুন্দরভাবে সাজাবে।</span></div>
 <div class="rx-grid">
  <label>বিক্রিয়ক<input id="rx-left" maxlength="70" placeholder="যেমন: 2H₂ + O₂"></label>
  <label class="rx-condition">তীরের ওপর<input id="rx-above" maxlength="45" placeholder="যেমন: Δ / Pt"></label>
  <label class="rx-condition">তীরের নিচে<input id="rx-below" maxlength="45" placeholder="যেমন: চাপ / দ্রাবক"></label>
  <label>উৎপাদ<input id="rx-right" maxlength="70" placeholder="যেমন: 2H₂O"></label>
  <label>তীর<select id="rx-arrow"><option>→</option><option>⇌</option><option>⇄</option></select></label>
  <button id="rx-add" class="on">চিত্রে যোগ করুন</button>
 </div>
 <div class="rx-presets"><span>দ্রুত উদাহরণ:</span><button data-rx="water">পানি</button><button data-rx="neutral">প্রশমন</button><button data-rx="photo">সালোকসংশ্লেষ</button></div>
</div>
<div id="gp" hidden>
 <textarea id="gq" rows="2" placeholder="সমীকরণ লিখুন — একাধিক হলে ; বা নতুন লাইন দিয়ে আলাদা করুন&#10;y = sin(x); x^2 + y^2 = 25; r = 1 + cos(t); (sin(3t), sin(2t))"></textarea>
 <label class="gl">পরিসর ±<input id="g_r" type="number" value="10" min="0.1" max="1000" step="any" style="width:70px"></label>
 <button id="gd" class="on">গ্রাফ আঁকুন</button><button id="gu" hidden>↻ নির্বাচিত গ্রাফ আপডেট</button><button id="gs">⚙ সেটিংস</button>
 <div id="go" hidden>
  <label class="gl">শিরোনাম<input id="g_title" type="text" style="width:150px" maxlength="60"></label>
  <label class="gl">x ন্যূনতম<input id="g_xMin" type="number" step="any"></label><label class="gl">x সর্বোচ্চ<input id="g_xMax" type="number" step="any"></label>
  <label class="gl">y ন্যূনতম<input id="g_yMin" type="number" step="any"></label><label class="gl">y সর্বোচ্চ<input id="g_yMax" type="number" step="any"></label>
  <label class="gl">t শুরু<input id="g_tMin" type="text" placeholder="0"></label><label class="gl">t শেষ<input id="g_tMax" type="text" placeholder="2pi"></label>
  <label class="gl"><input id="g_grid" type="checkbox" checked> জাল</label><label class="gl" title="গ্রাফের ওপরে সমীকরণের লেখা (যেমন y = ln(x)) দেখাবে — ডিফল্টে বন্ধ"><input id="g_legend" type="checkbox"> সমীকরণের লেখা দেখান</label>
 </div>
 <div id="gpre" style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:5px"></div>
</div>
<div id="cv"><svg id="s" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg" font-family="Hind Siliguri,Noto Sans Bengali,sans-serif">
<defs><pattern id="g" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#8a9a96" stroke-opacity=".28" stroke-width="1"/></pattern></defs>
<rect id="bgr" x="-4000" y="-4000" width="9000" height="9000" fill="#fff"/><rect id="gridr" x="-4000" y="-4000" width="9000" height="9000" fill="url(#g)"/><g id="L"></g><circle id="ecur" r="12" fill="rgba(255,255,255,.35)" stroke="#111" stroke-width="1.5" stroke-dasharray="4 3" style="display:none;pointer-events:none"/></svg></div>
<div class="row" id="tb"></div>
<div class="row" id="st"></div>
<div id="ov" hidden></div>
<div id="tx" hidden><div class="tp" role="dialog" aria-label="লেখা সম্পাদনা">
 <div class="th"><b>✎ লেখা সম্পাদনা</b><span><button id="tx_ok" class="on">✓ ঠিক আছে</button><button id="tx_no">✕ বাতিল</button></span></div>
 <svg id="tx_pv" aria-hidden="true" style="width:100%;height:64px;flex:none;border:1px dashed var(--bd);border-radius:9px"></svg>

    .replace(/√/g, 'sqrt ')
    .replace(/\*\*/g, '^');
  const tokens = (normalized.match(/(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?|[a-z]+|[()+\-*/%^,]/g) || []).flatMap(splitWord);
  if (!normalized.trim() || tokens.join('') !== normalized.replace(/\s+/g, '')) {
    throw new EquationGraphError('সূত্র বোঝা যায়নি — সমীকরণটি আবার দেখুন।');
  }

  let index = 0;
  const peek = () => tokens[index];
  const consume = () => tokens[index++];
  const expect = (expected        ) => {
    if (consume() !== expected) throw new EquationGraphError('সূত্র বোঝা যায়নি — বন্ধনী বা ফাংশনটি পরীক্ষা করুন।');
  };

  const parsePrimary = ()            => {
    let token = consume();
    if (!token) throw new EquationGraphError('সমীকরণের একটি অংশ অসম্পূর্ণ।');
    if (token === '(') {
      const inside = parseAdditive();
      expect(')');
      return inside;
    }
    if (/^(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/.test(token)) {
      const value = Number(token);
      return () => value;
    }
    if (/^[a-z]+$/.test(token)) {
      if (token === 'theta') token = 't';
      if (token === 'x' || token === 'y' || token === 't') {
        if (!allowedVariables.has(token)) {
          throw new EquationGraphError(`এই রূপে ${token} ব্যবহার করা যাবে না।`);
        }
        // t shares the first argument slot with x so polar / parametric curves reuse the same evaluator type.
        return token === 'y' ? (_x, y) => y : (x) => x;
      }
      if (Object.hasOwn(CONSTANTS, token)) return () => CONSTANTS[token];
      if (!Object.hasOwn(FUNCTIONS, token)) {
        throw new EquationGraphError(`“${token}” ফাংশনটি সমর্থিত নয়।`);
      }

      let powN = null;
      if (TRIG_FNS.has(token) && peek() === '^') {
        let k = index + 1, paren = false, neg = false;
        if (tokens[k] === '(') { paren = true; k++; }
        if (tokens[k] === '-') { neg = true; k++; }
        if (/^\d+$/.test(tokens[k] || '') && (!paren || tokens[k + 1] === ')')) {
          const n = (neg ? -1 : 1) * Number(tokens[k]);
          index = k + 1 + (paren ? 1 : 0);
          if (n === -1 && INV_FNS[token]) token = INV_FNS[token]; else powN = n;
        }
      }
      const definition = FUNCTIONS[token];
      let args             ;
      if (peek() === '(') {
        consume();
        args = [];
        if (peek() !== ')') {
          while (true) {
            args.push(parseAdditive());
            if (peek() !== ',') break;
            consume();
          }
        }
        expect(')');
      } else {
        args = [parseUnary()];
      }
      if (args.length !== definition.arity) {
        throw new EquationGraphError(`${token} ফাংশনে ${definition.arity}টি মান দিতে হবে।`);
      }
      return powN === null || powN === 1 ? (x, y) => definition.evaluate(args.map((arg) => arg(x, y))) : (x, y) => Math.pow(definition.evaluate(args.map((arg) => arg(x, y))), powN);
    }
    throw new EquationGraphError('সূত্র বোঝা যায়নি — সংখ্যা, x, y, বন্ধনী বা ফাংশন ব্যবহার করুন।');
  };

  const parsePower = ()            => {
    const base = parsePrimary();
    if (peek() !== '^') return base;
    consume();
    const exponent = parseUnary();
    return (x, y) => Math.pow(base(x, y), exponent(x, y));
  };

  const parseUnary = ()            => {
    if (peek() === '+') {
      consume();
      return parseUnary();
    }
    if (peek() === '-') {
      consume();
      const value = parseUnary();
      return (x, y) => -value(x, y);
    }
    return parsePower();
  };

  const canStartImplicitProduct = (token                    ) =>
    !!token && (/^(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/.test(token) || /^[a-z]+$/.test(token) || token === '(');

  const parseProduct = ()            => {
    let left = parseUnary();
    while (true) {
      const token = peek();
      if (token === '*' || token === '/' || token === '%') {
        consume();
        const right = parseUnary();
        const operator = token;
        const previous = left;
        left = operator === '*'
          ? (x, y) => previous(x, y) * right(x, y)
          : operator === '/'
            ? (x, y) => previous(x, y) / right(x, y)
            : (x, y) => previous(x, y) % right(x, y);
      } else if (canStartImplicitProduct(token)) {
        const right = parseUnary();
        const previous = left;
        left = (x, y) => previous(x, y) * right(x, y);
      } else {
        return left;
      }
    }
  };

  const parseAdditive = ()            => {
    let left = parseProduct();
    while (peek() === '+' || peek() === '-') {
      const operator = consume();
      const right = parseProduct();
      const previous = left;
      left = operator === '+'
        ? (x, y) => previous(x, y) + right(x, y)
        : (x, y) => previous(x, y) - right(x, y);
    }
    return left;
  };

  const expression = parseAdditive();
  if (index !== tokens.length) throw new EquationGraphError('সূত্র বোঝা যায়নি — অপারেটর বা বন্ধনী পরীক্ষা করুন।');
  return expression;
}

                            
                                                             
                                                                                                               
                               
                                                   
  

            
                                                     
                                                                          
                                                   
                                                                   
                              
                              

const COLORS = ['#147a68', '#d9534f', '#2f6fb5', '#e08a1e', '#7b52ab', '#2e7d32'];
const MAX_CURVES = COLORS.length;
const NO_GRAPH = 'এই পরিসরে গ্রাফ দেখা যাচ্ছে না — সমীকরণ বা পরিসর বদলে দেখুন।';

function splitTopLevel(source        , separator        ) {
  const parts           = [];
  let depth = 0;
  let current = '';
  for (const char of source) {
    if (char === '(') depth++;
    if (char === ')') depth--;
    if (char === separator && depth === 0) { parts.push(current); current = ''; } else current += char;
  }
  parts.push(current);
  return parts;
}

function parseCurve(source        )        {
  const equation = source.trim().replace(/[−–—]/g, '-').replace(/²/g, '^2').replace(/³/g, '^3');
  if (!equation) throw new EquationGraphError('আগে একটি সমীকরণ লিখুন।');
  const label = equation.replace(/\s+/g, ' ');

  if (equation.startsWith('(') && equation.endsWith(')') && !equation.includes('=')) {
    const parts = splitTopLevel(equation.slice(1, -1), ',');
    if (parts.length === 2) {
      const vars = new Set(['t']);
      return { kind: 'param', fx: parseExpression(parts[0], vars), fy: parseExpression(parts[1], vars), label };
    }
  }

  const equals = equation.match(/=/g) || [];
  if (equals.length > 1) throw new EquationGraphError('একটি সমীকরণে একটি “=” চিহ্ন ব্যবহার করুন।');
  if (!equals.length) return { kind: 'y', fn: parseExpression(equation, new Set(['x'])), label };

  const [leftSource, rightSource] = equation.split('=');
  if (!leftSource.trim() || !rightSource.trim()) throw new EquationGraphError('সমীকরণের দুই পাশে মান লিখুন।');
  const leftLabel = leftSource.replace(/\s+/g, '').toLowerCase().replace(/θ|theta/g, 't');
  if (['y', 'f(x)', 'y(x)'].includes(leftLabel)) return { kind: 'y', fn: parseExpression(rightSource, new Set(['x'])), label };
  if (['x', 'g(y)', 'x(y)'].includes(leftLabel)) return { kind: 'x', fn: parseExpression(rightSource, new Set(['y'])), label };
  if (['r', 'r(t)', 'ρ'].includes(leftLabel)) return { kind: 'polar', fn: parseExpression(rightSource, new Set(['t'])), label };
  return {
    kind: 'implicit',
    left: parseExpression(leftSource, new Set(['x', 'y'])),
    right: parseExpression(rightSource, new Set(['x', 'y'])),
    label,
  };
}

const PLOT = { left: 44, right: 390, top: 22, bottom: 356 };
const mapX = (value        , [min, max]       ) => PLOT.left + (value - min) / (max - min) * (PLOT.right - PLOT.left);
const mapY = (value        , [min, max]       ) => PLOT.bottom - (value - min) / (max - min) * (PLOT.bottom - PLOT.top);
const formatTick = (value        ) => String(Number(value.toFixed(3))).replace('-', '−');
const xml = (value        ) => value.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c] || c);

function tickStep(min        , max        ) {
  const raw = (max - min) / 5;
  const power = Math.pow(10, Math.floor(Math.log10(raw)));
  const unit = raw / power;
  return (unit <= 1 ? 1 : unit <= 2 ? 2 : unit <= 5 ? 5 : 10) * power;
}

function getTicks([min, max]       ) {
  const step = tickStep(min, max);
  const first = Math.ceil(min / step) * step;
  const ticks           = [];
  for (let value = first, count = 0; value <= max + step * 1e-8 && count < 30; value += step, count++) {
    ticks.push(Number(value.toPrecision(8)));
  }
  return ticks;
}

function axisMarkup(xView       , yView       , showGrid         ) {
  const xTicks = getTicks(xView);
  const yTicks = getTicks(yView);
  const grid = showGrid ? [
    ...xTicks.map((value) => `<line x1="${mapX(value, xView)}" y1="${PLOT.top}" x2="${mapX(value, xView)}" y2="${PLOT.bottom}"/>`),
    ...yTicks.map((value) => `<line x1="${PLOT.left}" y1="${mapY(value, yView)}" x2="${PLOT.right}" y2="${mapY(value, yView)}"/>`),
  ].join('') : '';
  const yAxis = xView[0] <= 0 && xView[1] >= 0 ? `<line x1="${mapX(0, xView)}" y1="${PLOT.top}" x2="${mapX(0, xView)}" y2="${PLOT.bottom}"/>` : '';
  const xAxis = yView[0] <= 0 && yView[1] >= 0 ? `<line x1="${PLOT.left}" y1="${mapY(0, yView)}" x2="${PLOT.right}" y2="${mapY(0, yView)}"/>` : '';
  const frame = showGrid ? '' : `<rect x="${PLOT.left}" y="${PLOT.top}" width="${PLOT.right - PLOT.left}" height="${PLOT.bottom - PLOT.top}" fill="none" stroke="#d3ddd8" stroke-width="1"/>`;
  const labels = [
    ...xTicks.map((value) => `<text x="${mapX(value, xView)}" y="${PLOT.bottom + 15}" text-anchor="middle">${formatTick(value)}</text>`),
    ...yTicks.map((value) => `<text x="${PLOT.left - 7}" y="${mapY(value, yView) + 3}" text-anchor="end">${formatTick(value)}</text>`),
  ].join('');
  return `<g fill="none" stroke="#e0e8e5" stroke-width="1">${grid}</g>${frame}<g fill="none" stroke="#52665f" stroke-width="1.5">${yAxis}${xAxis}</g><g fill="#667a73" stroke="none" font-family="sans-serif" font-size="9">${labels}<text x="${PLOT.right - 3}" y="${PLOT.bottom + 31}" text-anchor="end">x</text><text x="${PLOT.left - 22}" y="${PLOT.top + 5}">y</text></g>`;
}

function legendMarkup(curves         ) {
  const labels = curves.map((curve) => curve.label.length > 30 ? `${curve.label.slice(0, 29)}…` : curve.label);
  const width = Math.min(300, Math.max(...labels.map((label) => label.length)) * 5.4 + 34);
  const rows = labels.map((label, index) => {
    const y = PLOT.top + 14 + index * 14;
    return `<line x1="${PLOT.right - width + 6}" y1="${y - 3}" x2="${PLOT.right - width + 22}" y2="${y - 3}" stroke="${COLORS[index]}" stroke-width="2.5" stroke-linecap="round"/><text x="${PLOT.right - width + 27}" y="${y}">${xml(label)}</text>`;
  }).join('');
  return `<g><rect x="${PLOT.right - width}" y="${PLOT.top + 3}" width="${width - 4}" height="${labels.length * 14 + 8}" rx="4" fill="white" fill-opacity=".88" stroke="#d3ddd8"/><g fill="#34504a" font-family="sans-serif" font-size="9">${rows}</g></g>`;
}

function safeEvaluate(fn           , x        , y        ) {
  try {
    const value = fn(x, y);
    return Number.isFinite(value) && Math.abs(value) < 1e12 ? value : Number.NaN;
  } catch {
    return Number.NaN;
  }
}

function fitRange(values          )        {
  const sorted = values.filter((value) => Number.isFinite(value) && Math.abs(value) < 1e12).sort((a, b) => a - b);
  if (!sorted.length) throw new EquationGraphError(NO_GRAPH);
  let min = sorted[Math.floor((sorted.length - 1) * .02)];
  let max = sorted[Math.ceil((sorted.length - 1) * .98)];
  if (min === max) {
    const padding = Math.max(Math.abs(min) * .08, 1);
    min -= padding;
    max += padding;
  } else {
    const padding = Math.max((max - min) * .08, Math.max(Math.abs(min), Math.abs(max)) * .025, .1);
    min -= padding;
    max += padding;
  }
  if (min > 0 && min < .5) min = 0;
  if (max < 0 && max > -.5) max = 0;
  return [min, max];
}

/** Turns a list of points (NaN = gap) into SVG path data, breaking the line at gaps and large jumps (asymptotes). */
function tracePath(points         , xView       , yView       , jump            ) {
  const span = jump === 'x' ? xView[1] - xView[0] : yView[1] - yView[0];
  let pathData = '';
  let previous                = null;
  let drawing = false;
  for (const [x, y] of points) {
    const inRange = Number.isFinite(x) && Number.isFinite(y) && (jump === 'y'
      ? y >= yView[0] && y <= yView[1]
      : jump === 'x' ? x >= xView[0] && x <= xView[1] : Math.abs(x) < 1e6 && Math.abs(y) < 1e6);
    if (!inRange) { drawing = false; previous = null; continue; }
    const value = jump === 'x' ? x : y;
    const broke = jump !== undefined && previous !== null && Math.abs(value - previous) > span * .42;
    pathData += `${drawing && !broke ? 'L' : 'M'}${mapX(x, xView).toFixed(2)} ${mapY(y, yView).toFixed(2)} `;
    drawing = true;
    previous = value;
  }
  return pathData;
}

function marchingSquares(left           , right           , xDomain       , yDomain       , xView       , yView       ) {
  const spanX = xDomain[1] - xDomain[0];
  const spanY = yDomain[1] - yDomain[0];
  const stepsX = Math.max(80, Math.min(320, Math.round(Math.sqrt(spanX * spanX / (spanX * spanY)) * 260)));
  const stepsY = Math.max(80, Math.min(320, Math.round(Math.sqrt(spanY * spanY / (spanX * spanY)) * 260)));
  const width = stepsX + 1;
  const values = new Float64Array(width * (stepsY + 1));
  const at = (column        ) => xDomain[0] + column / stepsX * spanX;
  const atY = (row        ) => yDomain[1] - row / stepsY * spanY;
  for (let row = 0; row <= stepsY; row++) {
    for (let column = 0; column <= stepsX; column++) {
      values[row * width + column] = safeEvaluate(left, at(column), atY(row)) - safeEvaluate(right, at(column), atY(row));
    }
  }
  let pathData = '';
                                                    
  const interpolate = (a        , b        ) => {
    const amount = Math.max(0, Math.min(1, a.v / (a.v - b.v)));
    return { x: a.x + (b.x - a.x) * amount, y: a.y + (b.y - a.y) * amount };
  };
  const segment = (a                          , b                          ) => {
    pathData += `M${mapX(a.x, xView).toFixed(2)} ${mapY(a.y, yView).toFixed(2)}L${mapX(b.x, xView).toFixed(2)} ${mapY(b.y, yView).toFixed(2)} `;
  };
  for (let row = 0; row < stepsY; row++) {
    for (let column = 0; column < stepsX; column++) {
      const corners           = [
        { x: at(column), y: atY(row), v: values[row * width + column] },
        { x: at(column + 1), y: atY(row), v: values[row * width + column + 1] },
        { x: at(column + 1), y: atY(row + 1), v: values[(row + 1) * width + column + 1] },
        { x: at(column), y: atY(row + 1), v: values[(row + 1) * width + column] },
      ];
      const crossings = ([[0, 1], [1, 2], [2, 3], [3, 0]]                           ).flatMap(([start, end]) => {
        const a = corners[start], b = corners[end];
        if (!Number.isFinite(a.v) || !Number.isFinite(b.v) || (a.v < 0) === (b.v < 0)) return [];
        return [interpolate(a, b)];
      });
      if (crossings.length === 2) segment(crossings[0], crossings[1]);
      else if (crossings.length === 4) {
        const centerPositive = (corners[0].v + corners[1].v + corners[2].v + corners[3].v) / 4 >= 0;
        if (centerPositive === corners[0].v >= 0) { segment(crossings[0], crossings[1]); segment(crossings[2], crossings[3]); }
        else { segment(crossings[0], crossings[3]); segment(crossings[1], crossings[2]); }
      }
    }
  }
  return pathData;
}

function resolveBounds(min                    , max                    , fallback        , axis        )                    {
  if (min === undefined && max === undefined) return undefined;
  const lo = min ?? -fallback;
  const hi = max ?? fallback;
  if (!Number.isFinite(lo) || !Number.isFinite(hi) || lo >= hi || Math.abs(lo) > 1e6 || Math.abs(hi) > 1e6) {
    throw new EquationGraphError(`${axis}-এর সীমা ঠিক নেই — ছোট মান আগে, বড় মান পরে দিন।`);
  }
  return [lo, hi];
}

function parameterValue(source                    , fallback        ) {
  if (!source || !source.trim()) return fallback;
  const value = safeEvaluate(parseExpression(source, new Set()), 0, 0);
  if (!Number.isFinite(value)) throw new EquationGraphError('t-এর সীমা বোঝা যায়নি — যেমন 0 বা 2pi লিখুন।');
  return value;
}

function splitEquations(source        ) {
  const list = source.split(/[;\n]+/).map((part) => part.trim()).filter(Boolean);
  if (!list.length) throw new EquationGraphError('আগে একটি সমীকরণ লিখুন।');
  if (list.length > MAX_CURVES) throw new EquationGraphError(`একসাথে সর্বোচ্চ ${MAX_CURVES}টি সমীকরণ দেওয়া যাবে।`);
  return list;
}

function render(curves         , range        , options              ) {
  const userX = resolveBounds(options.xMin, options.xMax, range, 'x');
  const userY = resolveBounds(options.yMin, options.yMax, range, 'y');
  const domainX        = userX ?? [-range, range];
  const domainY        = userY ?? [-range, range];
  const tMin = parameterValue(options.tMin, 0);
  const tMax = parameterValue(options.tMax, Math.PI * 2);
  if (tMax <= tMin) throw new EquationGraphError('t-এর শেষ মান শুরুর মানের চেয়ে বড় হতে হবে।');

                                                   
  const sampled            = [];
  const implicitCurves                                              = [];
  for (const curve of curves) {
    if (curve.kind === 'y' || curve.kind === 'x') {
      const [lo, hi] = curve.kind === 'y' ? domainX : domainY;
      const points = Array.from({ length: 801 }, (_, index)        => {
        const input = lo + index / 800 * (hi - lo);
        return curve.kind === 'y' ? [input, safeEvaluate(curve.fn, input, 0)] : [safeEvaluate(curve.fn, 0, input), input];
      });
      sampled.push({ curve, points });
    } else if (curve.kind === 'polar') {
      const points = Array.from({ length: 1441 }, (_, index)        => {
        const t = tMin + index / 1440 * (tMax - tMin);
        const r = safeEvaluate(curve.fn, t, 0);
        return [r * Math.cos(t), r * Math.sin(t)];
      });
      sampled.push({ curve, points });
    } else if (curve.kind === 'param') {
      const points = Array.from({ length: 1441 }, (_, index)        => {
        const t = tMin + index / 1440 * (tMax - tMin);
        return [safeEvaluate(curve.fx, t, 0), safeEvaluate(curve.fy, t, 0)];
      });
      sampled.push({ curve, points });
    } else implicitCurves.push(curve);
  }

  const kinds = new Set(curves.map((curve) => curve.kind));
  const only = (...allowed                      ) => [...kinds].every((kind) => allowed.includes(kind));
  const allPoints = sampled.flatMap((entry) => entry.points);
  let xView = userX;
  let yView = userY;
  if (only('polar', 'param')) {
    const finite = allPoints.filter(([x, y]) => Number.isFinite(x) && Number.isFinite(y) && Math.abs(x) < 1e6 && Math.abs(y) < 1e6);
    if (!finite.length) throw new EquationGraphError(NO_GRAPH);
    const xs = finite.map(([x]) => x), ys = finite.map(([, y]) => y);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const half = Math.max((maxX - minX) / 2, (maxY - minY) / 2, .5) * 1.12;
    xView = xView ?? [(minX + maxX) / 2 - half, (minX + maxX) / 2 + half];
    yView = yView ?? [(minY + maxY) / 2 - half, (minY + maxY) / 2 + half];
  } else {
    if (!xView) xView = only('x') ? fitRange(allPoints.map(([x]) => x)) : domainX;
    if (!yView) yView = only('y') ? fitRange(allPoints.map(([, y]) => y)) : domainY;
  }
  const finalX = xView         , finalY = yView         ;

  const paths           = [];
  curves.forEach((curve, index) => {
    let pathData = '';
    if (curve.kind === 'implicit') pathData = marchingSquares(curve.left, curve.right, finalX, finalY, finalX, finalY);
    else {
      const entry = sampled.find((item) => item.curve === curve) ;
      pathData = tracePath(entry.points, finalX, finalY, curve.kind === 'y' ? 'y' : curve.kind === 'x' ? 'x' : undefined);
    }
    if (pathData) paths.push(`<path d="${pathData}" clip-path="url(#plot)" fill="none" stroke="${COLORS[index]}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`);
  });
  if (!paths.length) throw new EquationGraphError(NO_GRAPH);

  const showLegend = options.legend ?? curves.length > 1;
  const title = options.title?.trim() ? `<text x="${(PLOT.left + PLOT.right) / 2}" y="14" text-anchor="middle" font-family="Hind Siliguri, sans-serif" font-size="12" font-weight="700" fill="#2a4a42">${xml(options.title.trim().slice(0, 60))}</text>` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><rect width="400" height="400" fill="white"/><defs><clipPath id="plot"><rect x="${PLOT.left}" y="${PLOT.top}" width="${PLOT.right - PLOT.left}" height="${PLOT.bottom - PLOT.top}"/></clipPath></defs>${axisMarkup(finalX, finalY, options.grid ?? true)}${paths.join('')}${showLegend ? legendMarkup(curves) : ''}${title}</svg>`;
}

function createEquationSvg(source        , requestedRange        , options               = {}) {
  if (!Number.isFinite(requestedRange) || requestedRange < 0.1 || requestedRange > 1000) {
    throw new EquationGraphError('পরিসর ০.১ থেকে ১০০০-এর মধ্যে দিন।');
  }
  try {
    return render(splitEquations(source).map(parseCurve), requestedRange, options);
  } catch (error) {
    if (error instanceof EquationGraphError) throw error;
    throw new EquationGraphError('সমীকরণ থেকে গ্রাফ তৈরি হয়নি — সূত্রটি পরীক্ষা করুন।');
  }
}

 if(i.lk)o.lk=true;if(i.fx)o.fx=true;if(i.d)o.d=true;
 if(i.f)o.f=_col(i.f,'');
 if(i.k==='st'){if(typeof i.id!=='string'||!Object.prototype.hasOwnProperty.call(S,i.id))return null;o.id=i.id}
 if(i.k==='pen'){o.p=_pts(i.p);if(o.p.length<1)return null}
 if(i.k==='img'){if(typeof i.u!=='string'||!_IMG.test(i.u))return null;o.u=i.u}
 if(i.k==='text'){o.t=String(i.t==null?'':i.t).slice(0,5000);o.fs=Math.max(4,Math.min(400,_num(i.fs,20)));o.lh=_num(i.lh,1.25);o.ff=Object.prototype.hasOwnProperty.call(FF,i.ff)?i.ff:'s';o.al=['l','c','r'].includes(i.al)?i.al:'l';if(i.b)o.b=true;if(i.it)o.it=true;if(i.u)o.u=true;if(i.hl)o.hl=_col(i.hl,'')}
 if(Array.isArray(i.er))o.er=i.er.filter(q=>q&&Array.isArray(q.p)).map(q=>({w:Math.max(.1,Math.min(2000,_num(q.w,10))),p:_pts(q.p)})).filter(q=>q.p.length>0);
 return o}

const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','=':'⁼','(':'⁽',')':'⁾','a':'ᵃ','b':'ᵇ','c':'ᶜ','d':'ᵈ','e':'ᵉ','f':'ᶠ','g':'ᵍ','h':'ʰ','i':'ⁱ','j':'ʲ','k':'ᵏ','l':'ˡ','m':'ᵐ','n':'ⁿ','o':'ᵒ','p':'ᵖ','r':'ʳ','s':'ˢ','t':'ᵗ','u':'ᵘ','v':'ᵛ','w':'ʷ','x':'ˣ','y':'ʸ','z':'ᶻ'};

 '<b>☑ বহু-নির্বাচন</b> চালু করে বস্তুতে ট্যাপ/ক্লিক করলে সেটি নির্বাচনে যোগ হয়, আবার ট্যাপ করলে বাদ যায়। এই অবস্থায় ফাঁকা জায়গায় টেনে <b>বক্স দিয়ে</b> অনেকগুলো একসাথে নির্বাচন করা যায়। কম্পিউটারে <kbd>Shift</kbd>/<kbd>Ctrl</kbd> চেপে ক্লিক করলেও একই কাজ হয়।',
 '<b>সব নির্বাচন</b> (বা <kbd>Ctrl</kbd>+<kbd>A</kbd>) — সব বস্তু একসাথে ধরে।',
 'নির্বাচিত দলকে একসাথে <b>টেনে সরানো</b>, <kbd>←↑→↓</kbd> দিয়ে সরানো, কপি, মোছা, সামনে/পেছনে আনা এবং রং, স্বচ্ছতা, ভরাট, ডট রেখা, উল্টানো বদলানো যায়। দলে <b>⟳ 90°</b> ও <b>⇋ উল্টান</b> পুরো দলকে কেন্দ্র ধরে একসাথে ঘোরায়/উল্টায়; আকার ও ঘূর্ণনের স্লাইডার দেখায় না।',
 '২টি বা বেশি নির্বাচন করলে <b>সাজান</b> সারি আসে: <b>বাম / মাঝ / ডান</b> (সারিবদ্ধ), <b>উপর / মাঝ / নিচ</b>, এবং <b>সমান ফাঁক</b> (অনুভূমিক বা উল্লম্ব) — তাতে বস্তুগুলোর মাঝের দূরত্ব সমান হয়ে যায়। লক করা বস্তু নড়ে না।']],
 en:['4. Multiple items & aligning',[
 'Turn on <b>☑ Multi-select</b>, then tap/click items to add them to the selection and tap again to remove. While it is on, drag on empty space to select several with a <b>selection box</b>. On a computer, <kbd>Shift</kbd>/<kbd>Ctrl</kbd>+click does the same.',
 '<b>Select all</b> (or <kbd>Ctrl</kbd>+<kbd>A</kbd>) — selects every item.',
 'The selected group can be <b>dragged together</b>, nudged with <kbd>←↑→↓</kbd>, duplicated, deleted, brought to front/back, and you can change colour, opacity, fill, dotted line and flip. For a group, <b>⟳ 90°</b> and <b>⇋ Flip</b> turn/mirror the whole group around its centre; the size and rotation sliders are hidden.',
 'With 2 or more selected the <b>Align</b> row appears: <b>Left / Middle / Right</b>, <b>Top / Middle / Bottom</b>, and <b>Even gaps</b> (horizontal or vertical) which spaces the items equally. Locked items do not move.']]},
{bn:['৫. লেখা সম্পাদক',[
 'লেখা যোগ করতে <b>T লেখা</b> টুল বেছে ক্যানভাসে ক্লিক করুন। আগের লেখা বদলাতে লেখায় <b>ডাবল-ক্লিক</b> করুন, অথবা লেখা নির্বাচন করে <b>✎ লেখা বদলান</b> চাপুন (মোবাইলে এটাই সহজ)।',
 '<b>একাধিক লাইন</b> — Enter চাপলে নতুন লাইন। <b>ফন্ট</b> — Sans / Serif / Mono। <b>আকার</b> — ১২–১৬০।',
 '<b>B / I / U</b> — বোল্ড, ইটালিক, আন্ডারলাইন। <b>বাম / মাঝে / ডান</b> — লাইন সাজানো। <b>লাইন ফাঁক</b> — ১.০ থেকে ২.০।',
 '<b>রং</b> — লেখার রং। <b>হাইলাইট</b> — লেখার পেছনে রঙিন ব্যাকগ্রাউন্ড।',
 '<b>x₂ নিচে / x² উপরে</b> — লেখার অংশ সিলেক্ট করে চাপুন (যেমন H2O-তে ২ সিলেক্ট করে ‘নিচে’)। কিছু সিলেক্ট না থাকলে কার্সরের ঠিক আগের অক্ষর বদলায়। <b>Aa সাধারণ</b> — আবার স্বাভাবিক করে। সংখ্যা, + − = ( ) এবং অনেক ইংরেজি অক্ষর সমর্থিত।',
 '<b>চিহ্নের সারি</b> — α β π Δ Ω ± × ÷ √ ∞ ≤ ≥ ∫ → ⇌ ইত্যাদি ট্যাপ করলে কার্সরের জায়গায় বসে।',
 '<b>✓ ঠিক আছে</b> (বা <kbd>Ctrl</kbd>+<kbd>Enter</kbd>) সংরক্ষণ করে; <b>✕ বাতিল</b> (বা <kbd>Esc</kbd>) আগের অবস্থায় ফেরায়। শেষ ব্যবহৃত ফন্ট/স্টাইল পরের নতুন লেখায় আপনাআপনি আসে।']],
 en:['5. Text editor',[
 'To add text pick the <b>T Text</b> tool and click the canvas. To change existing text <b>double-click</b> it, or select it and press <b>✎ Edit text</b> (easiest on mobile).',
 '<b>Multiple lines</b> — press Enter for a new line. <b>Font</b> — Sans / Serif / Mono. <b>Size</b> — 12–160.',
 '<b>B / I / U</b> — bold, italic, underline. <b>Left / Centre / Right</b> — alignment. <b>Line spacing</b> — 1.0 to 2.0.',
 '<b>Colour</b> — text colour. <b>Highlight</b> — coloured background behind the text.',
 '<b>x₂ Subscript / x² Superscript</b> — select part of the text and press it (e.g. select the 2 in H2O and press Subscript). With nothing selected, the character just before the cursor is changed. <b>Aa Normal</b> reverts it. Digits, + − = ( ) and many Latin letters are supported.',
 '<b>Symbol row</b> — tap α β π Δ Ω ± × ÷ √ ∞ ≤ ≥ ∫ → ⇌ etc. to insert at the cursor.',
 '<b>✓ OK</b> (or <kbd>Ctrl</kbd>+<kbd>Enter</kbd>) saves; <b>✕ Cancel</b> (or <kbd>Esc</kbd>) reverts. The last font/style you used is applied to the next new text automatically.']]},
{bn:['৬. রং ও ব্যাকগ্রাউন্ড',[
 '<b>রং</b> ও <b>মোটা</b> (সেটিং-বারের উপরের সারি) — কিছু নির্বাচন না থাকলে পরের আঁকা বস্তুর রং/পুরুত্ব ঠিক করে; নির্বাচন থাকলে সেই বস্তু বদলায়।',
 '<b>🖼 ব্যাকগ্রাউন্ড</b> — প্রিসেট রং বা নিজের পছন্দের রং বেছে ক্যানভাস ও ছবির ব্যাকগ্রাউন্ড বদলান। <b>স্বচ্ছ</b> টিক দিলে ছবির ব্যাকগ্রাউন্ড থাকে না (PNG স্বচ্ছ)।',
 'গাঢ় ব্যাকগ্রাউন্ডে গেলে নতুন আঁকার ডিফল্ট রং কালো থেকে সাদা হয়ে যায় (আগের বস্তুর রং নিজে বদলাতে হবে)।',
 'ব্যাকগ্রাউন্ড রং সংরক্ষিত প্রকল্পের সাথে থাকে, তাই পরে সম্পাদনা করলে একই ব্যাকগ্রাউন্ড ফিরে আসে।']],
 en:['6. Colour & background',[
 '<b>Colour</b> and <b>Thickness</b> (top row of the settings) — with nothing selected they set the colour/width of the next thing you draw; with an item selected they change that item.',
 '<b>🖼 Background</b> — choose a preset or your own colour to change the canvas and image background. Tick <b>Transparent</b> for an image with no background (transparent PNG).',
 'Switching to a dark background turns the default drawing colour from black to white (existing items keep their colour — change them yourself).',
 'The background colour is stored with the saved project, so editing later restores it.']]},
{bn:['৭. জাল (গ্রিড) ও স্ন্যাপ',[
 '<b>▦ জাল</b> — স্ক্রিনে জাল দেখায়/লুকায়। জাল <b>কখনও ছবিতে যায় না</b>।',
 '<b>🧲 জালে বসান</b> — চালু থাকলে আঁকা ও সরানোর সময় বস্তু জালের ঘরে বসে যায়; সোজা ও সুন্দর ডায়াগ্রামের জন্য কাজে লাগে।']],
 en:['7. Grid & snap',[
 '<b>▦ Grid</b> — shows/hides the grid on screen. The grid is <b>never included in the image</b>.',
 '<b>🧲 Snap to grid</b> — when on, items snap to grid squares while drawing and moving; handy for neat, straight diagrams.']]},
{bn:['৮. জুম ও পর্দা সরানো',[
 '<b>🔍− / 🔍＋</b> বাটন, মাউস হুইল বা দুই আঙুলে পিঞ্চ করে জুম করুন।',
 '<b>☝ নির্বাচন</b> টুলে খালি জায়গা টেনে পর্দা সরান। <b>⤢ ফিট</b> — পুরো ডায়াগ্রাম এক নজরে দেখায়।',
 'নির্বাচিত বস্তুকে <kbd>←↑→↓</kbd> দিয়ে ৪ একক, <kbd>Shift</kbd> সহ ২০ একক সরানো যায়।']],
 en:['8. Zoom & panning',[
 'Zoom with the <b>🔍− / 🔍＋</b> buttons, the mouse wheel, or a two-finger pinch.',
 'With the <b>☝ Select</b> tool, drag an empty area to pan. <b>⤢ Fit</b> shows the whole diagram at a glance.',
 'Move the selected item with <kbd>←↑→↓</kbd> (4 units), or with <kbd>Shift</kbd> (20 units).']]},
{bn:['৯. ডায়াগ্রাম লাইব্রেরি ও খোঁজা',[
 'বিষয় → ক্যাটাগরি বেছে তালিকা থেকে ট্যাপ করলে ডায়াগ্রাম ক্যানভাসের মাঝে বসে; এরপর যেকোনো বস্তুর মতো সম্পাদনা করা যায়।',
 '<b>🔎 খুঁজুন</b> বক্সে বাংলা বা ইংরেজি নাম লিখলে বর্তমান ক্যাটাগরির মধ্যে ফিল্টার হয়।',
 'গ্রিক অক্ষর ও গণিত প্রতীকগুলো লেখা হিসেবে বসে, তাই পরে রং, আকার বদলানো যায়।']],
 en:['9. Diagram library & search',[
 'Choose subject → category and tap an item; it is placed in the middle of the canvas and can be edited like any other item.',
 'Type a Bengali or English name in the <b>🔎 search</b> box to filter within the current category.',
 'Greek letters and maths symbols are inserted as text, so colour and size can be changed afterwards.']]},
{bn:['১০. যৌগ আঁকা (রসায়ন)',[
 '<b>🧪 যৌগের নাম/SMILES</b> বক্সে ইংরেজি নাম (যেমন aspirin) বা SMILES (যেমন CCO) লিখে <b>যৌগ আঁকুন</b> চাপুন।',
 'এর জন্য <b>ইন্টারনেট</b> লাগে (PubChem থেকে ছবি আসে)। ছবিটি একটি ছবি-বস্তু হিসেবে বসে — ছোট-বড়, ঘোরানো যায়, কিন্তু রেখা আলাদা করে বদলানো যায় না।']],
 en:['10. Drawing compounds (Chemistry)',[
 'Type an English name (e.g. aspirin) or a SMILES string (e.g. CCO) in the <b>🧪 Compound name/SMILES</b> box and press <b>Draw compound</b>.',
 'This needs the <b>internet</b> (the picture comes from PubChem). It is added as an image item — you can resize/rotate it, but not edit its individual lines.']]},
{bn:['১১. গ্রাফ ও সমীকরণ',[
 '<b>📈 গ্রাফ</b> বাটনে প্যানেল খুলুন, সমীকরণ লিখে <b>গ্রাফ আঁকুন</b> চাপুন (<kbd>Ctrl</kbd>+<kbd>Enter</kbd>-ও চলে)। একসাথে সর্বোচ্চ ৬টি সমীকরণ — <b>;</b> বা নতুন লাইন দিয়ে আলাদা করুন; প্রত্যেকটির আলাদা রং।',
 'ধরন: <b>y = f(x)</b> (y = sin(x)/x), <b>x = g(y)</b> (x = y^2), অন্তর্নিহিত (x^2 + y^2 = 25), পোলার <b>r = f(t)</b> (r = 1 + cos(t)), প্যারামেট্রিক <b>(fx(t), fy(t))</b> ((sin(3t), sin(2t))) ।',
 'ফাংশন: sin cos tan cot sec csc asin acos atan sinh cosh tanh sqrt cbrt abs ln log log2 log10 exp floor ceil round sign min max pow atan2 mod; ধ্রুবক pi, tau, e; <b>2x</b>, <b>3sin(x)</b> লেখা যায়। এছাড়া <b>|x|</b> (মডুলাস), <b>sin²(x)</b> বা <b>sin^2(x)</b>, <b>sinx</b>, <b>xy</b> এবং বাংলা অঙ্ক (যেমন ২x + ৩) চলে।',
 '<b>পরিসর ±</b> — অক্ষের সীমা (০.১ থেকে ১০০০)। <b>⚙ সেটিংস</b> — শিরোনাম, x/y-এর আলাদা সীমা, t-এর সীমা (0, 2pi, 6pi…), গ্রিড, সমীকরণের লেখা দেখানো।',
 'নিচের <b>প্রিসেট চিপ</b> ট্যাপ করলে পরিচিত গ্রাফ (রেখা, পরাবৃত্ত, sin, বৃত্ত, কার্ডিওয়েড ইত্যাদি) এক ট্যাপে আঁকা হয়।',
 'আঁকা গ্রাফ নির্বাচন করলে প্যানেলে তার সমীকরণ ফিরে আসে; বদলে <b>↻ নির্বাচিত গ্রাফ আপডেট</b> চাপুন।']],
 en:['11. Graphs & equations',[
 'Open the panel with the <b>📈 Graph</b> button, type equation(s) and press <b>Draw graph</b> (<kbd>Ctrl</kbd>+<kbd>Enter</kbd> works too). Up to 6 at once — separate with <b>;</b> or a new line; each gets its own colour.',
 'Forms: <b>y = f(x)</b> (y = sin(x)/x), <b>x = g(y)</b> (x = y^2), implicit (x^2 + y^2 = 25), polar <b>r = f(t)</b> (r = 1 + cos(t)), parametric <b>(fx(t), fy(t))</b> ((sin(3t), sin(2t))).',
 'Functions: sin cos tan cot sec csc asin acos atan sinh cosh tanh sqrt cbrt abs ln log log2 log10 exp floor ceil round sign min max pow atan2 mod; constants pi, tau, e; you can write <b>2x</b> and <b>3sin(x)</b>. Also <b>|x|</b> (modulus), <b>sin²(x)</b> or <b>sin^2(x)</b>, <b>sinx</b>, <b>xy</b> and Bengali digits (e.g. ২x + ৩) work.',
 '<b>Range ±</b> — axis limits (0.1 to 1000). <b>⚙ Settings</b> — title, separate x/y limits, t limits (0, 2pi, 6pi…), grid, show equation label.',
 'Tap a <b>preset chip</b> below to draw a well-known graph (line, parabola, sin, circle, cardioid, etc.) in one tap.',
 'Selecting a drawn graph loads its equations back into the panel; change them and press <b>↻ Update selected graph</b>.']]},
{bn:['১২. সংরক্ষণ ও ব্যবহার',[
 '<b>PNG</b> — চারপাশের ফাঁকা অংশ ছেঁটে উচ্চ রেজোলিউশনের ছবি দেয়। <b>SVG</b> — ভেক্টর ছবি, ছাপা বা বড় করার জন্য ভালো। ছবি খুললে <b>⬇ ডাউনলোড</b> চাপুন, বা ছবিটি চেপে ধরে সংরক্ষণ করুন।',
 '<b>✅ প্রশ্নে/অপশনে যুক্ত করুন</b> (শুধু MCQ সাইটের ভেতরে) — ছবি প্রশ্ন বা অপশনে বসে এবং সম্পাদনাযোগ্য প্রকল্পটিও সাথে সংরক্ষিত হয়; পরে আবার খুললে আগের সব বস্তু ও ব্যাকগ্রাউন্ড ফিরে আসে। প্রশ্নে যুক্ত করার সময় সাইট স্বচ্ছ অংশে সাদা বসাতে পারে — তাই পরীক্ষার প্রশ্নে সাদা ব্যাকগ্রাউন্ডই নিরাপদ।',
 'সাইটের বাইরে আলাদা খুললে আপনার কাজ এই ব্রাউজারে <b>আপনাআপনি সংরক্ষিত</b> থাকে এবং আবার খুললে ফিরে আসে।',

let gl=lang;
function renderGuide(){
 $('#gt').textContent=gl==='en'?'📖 Guide — every option explained':'📖 গাইড — সব অপশনের ব্যাখ্যা';
 document.querySelectorAll('#gdv [data-gl]').forEach(b=>b.classList.toggle('on',b.dataset.gl===gl));
 $('#gcn').innerHTML=GUIDE.map(g=>{const[t,it]=g[gl];return`<h3>${t}</h3><ul>${it.map(x=>`<li>${x}</li>`).join('')}</ul>`}).join('')}
$('#hb').onclick=()=>{gl=lang;renderGuide();$('#gdv').hidden=false;$('#gcn').scrollTop=0};
document.querySelectorAll('#gdv [data-gl]').forEach(b=>b.onclick=()=>{gl=b.dataset.gl;renderGuide();$('#gcn').scrollTop=0});
$('#gx').onclick=()=>{$('#gdv').hidden=true};
$('#gdv').onclick=e=>{if(e.target.id==='gd')$('#gdv').hidden=true};

// ================= v12: একাধিক বস্তু নির্বাচন · সাজানো (align) · লক · প্রকল্প ফাইল সেভ/খোলা =================
Object.assign(EN,{
'বহু-নির্বাচন':'Multi-select','সব নির্বাচন':'Select all','একাধিক বস্তু নির্বাচন: ট্যাপ/ক্লিকে যোগ-বাদ, ফাঁকা জায়গায় টেনে বক্স নির্বাচন':'Multi-select: tap/click to add or remove, drag on empty space for a selection box','সব বস্তু নির্বাচন (Ctrl+A)':'Select every item (Ctrl+A)',
'সংরক্ষণ':'Save','খুলুন':'Open','প্রকল্প ফাইল (.json) হিসেবে সংরক্ষণ':'Save the project as a file (.json)','সংরক্ষিত প্রকল্প ফাইল খুলুন':'Open a saved project file',
'লক':'Lock','টেনে সরানো ও ছোট-বড় করা বন্ধ/চালু':'Lock/unlock dragging and resizing','সাজান':'Align',
'বামে সারিবদ্ধ':'Align left','অনুভূমিক মাঝে':'Centre horizontally','ডানে সারিবদ্ধ':'Align right','উপরে সারিবদ্ধ':'Align top','উল্লম্ব মাঝে':'Centre vertically','নিচে সারিবদ্ধ':'Align bottom','অনুভূমিকভাবে সমান ফাঁক':'Distribute horizontally','উল্লম্বভাবে সমান ফাঁক':'Distribute vertically',
'উপর':'Top','নিচ':'Bottom','মাঝ':'Middle','সমান ফাঁক':'Even gaps','ফাইলটি পড়া যায়নি':'Could not read the file','✓ প্রকল্প খোলা হয়েছে':'✓ Project opened'
});
const MS=new Set();let multi=false,mq=null;
const targets=()=>MS.size>1?[...MS]:(sel!=null&&items[sel]?[items[sel]]:[]);
function prune(){[...MS].forEach(q=>{if(!items.includes(q))MS.delete(q)});if(MS.size<2||sel==null||tool!=='sel')MS.clear()}
function toggleMs(it){
 if(!MS.size&&items[sel]===it){sel=null;return}
 if(!MS.size&&sel!=null&&items[sel])MS.add(items[sel]);
 if(MS.has(it))MS.delete(it);else MS.add(it);
 if(MS.size===0)sel=null;else if(MS.size===1){sel=items.indexOf([...MS][0]);MS.clear()}else sel=items.indexOf(it)}
function selAll(){if(tool!=='sel'){tool='sel';ui()}MS.clear();items.forEach(q=>MS.add(q));if(items.length===1){sel=0;MS.clear()}else if(items.length>1)sel=items.length-1;else sel=null;render()}
function finishMq(){
 const q=mq;mq=null;if(!q||q.w+q.h<4)return;
 const m=svg.getScreenCTM(),x0=q.x*m.a+m.e,y0=q.y*m.d+m.f,x1=(q.x+q.w)*m.a+m.e,y1=(q.y+q.h)*m.d+m.f;
 sel=null;MS.clear();render();
 L.querySelectorAll('g[data-i]').forEach(g=>{const r=g.getBoundingClientRect();if(r.right>=x0&&r.left<=x1&&r.bottom>=y0&&r.top<=y1)MS.add(items[+g.dataset.i])});
 const a=[...MS];if(a.length===1){sel=items.indexOf(a[0]);MS.clear()}else if(a.length>1)sel=items.indexOf(a[a.length-1])}
$('#mu').onclick=e=>{multi=!multi;e.currentTarget.classList.toggle('on',multi);if(multi&&tool!=='sel'){tool='sel';ui()}};
$('#sa').onclick=selAll;
// ---- সাজান ----
function boxes(){const m=svg.getScreenCTM();return[...MS].map(it=>{const g=L.querySelector(`g[data-i="${items.indexOf(it)}"]`),r=g.getBoundingClientRect();return{it,x:(r.left-m.e)/m.a,y:(r.top-m.f)/m.d,w:r.width/m.a,h:r.height/m.d}})}
function alignTo(k){
 if(MS.size<2)return;const b=boxes();save();
 const x0=Math.min(...b.map(o=>o.x)),x1=Math.max(...b.map(o=>o.x+o.w)),y0=Math.min(...b.map(o=>o.y)),y1=Math.max(...b.map(o=>o.y+o.h));
 if(k==='dh'||k==='dv'){
  const H=k==='dh',s=[...b].sort((p,q)=>H?p.x-q.x:p.y-q.y),tot=s.reduce((a,o)=>a+(H?o.w:o.h),0),gap=((H?x1-x0:y1-y0)-tot)/(s.length-1);let c=H?x0:y0;
  s.forEach(o=>{if(!o.it.lk){if(H)o.it.x+=c-o.x;else o.it.y+=c-o.y}c+=(H?o.w:o.h)+gap})}
 else b.forEach(o=>{if(o.it.lk)return;
  if(k==='l')o.it.x+=x0-o.x;if(k==='r')o.it.x+=x1-o.x-o.w;if(k==='c')o.it.x+=(x0+x1)/2-(o.x+o.w/2);
  if(k==='t')o.it.y+=y0-o.y;if(k==='b')o.it.y+=y1-o.y-o.h;if(k==='m')o.it.y+=(y0+y1)/2-(o.y+o.h/2)});
 render()}
document.querySelectorAll('#al [data-a]').forEach(b=>b.onclick=()=>alignTo(b.dataset.a));
$('#lk').onclick=mod(i=>{i.lk=!i.lk});

$('#pj').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(proj())],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='diagram-project.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)};
$('#po').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const a=JSON.parse(r.result);if(!Array.isArray(a))throw 0;const prev=JSON.stringify(items);loadProj(a);undo.push(prev);msg('✓ প্রকল্প খোলা হয়েছে')}catch(_){msg('ফাইলটি পড়া যায়নি')}};r.readAsText(f)};

  (items[sel]&&items[sel].g&&!$('#gu').hidden?$('#gu'):$('#gd')).click()}});
// দলের ঘোরানো ও উল্টানো — পুরো দল একসাথে, কেন্দ্র ধরে
function groupCenter(){const b=boxes();return{b,cx:(Math.min(...b.map(o=>o.x))+Math.max(...b.map(o=>o.x+o.w)))/2,cy:(Math.min(...b.map(o=>o.y))+Math.max(...b.map(o=>o.y+o.h)))/2}}
{const ro0=$('#ro').onclick,fx0=$('#fx').onclick;
 $('#ro').onclick=()=>{if(MS.size<2)return ro0();save();const{b,cx,cy}=groupCenter();
  b.forEach(o=>{const q=o.it;if(q.lk)return;const dx=q.x-cx,dy=q.y-cy;q.x=cx-dy;q.y=cy+dx;q.r=((q.r||0)+90)%360});render()};
 $('#fx').onclick=()=>{if(MS.size<2)return fx0();save();const{b,cx}=groupCenter();
  b.forEach(o=>{const q=o.it;if(q.lk)return;if(q.k==='text'){q.x+=2*(cx-(o.x+o.w/2))}else{q.x=2*cx-q.x;q.r=-(q.r||0);q.fx=!q.fx}});render()}}

ui();render();
$('#lg').onclick=()=>setLang(lang==='en'?'bn':'en');trStatic();restoreAuto();
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||!$('#tx').hidden||!$('#gdv').hidden)return;const ctrl=e.ctrlKey||e.metaKey;
 if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();$('#de').click()}
 else if(ctrl&&e.key.toLowerCase()==='z'){e.preventDefault();(e.shiftKey?$('#rd'):$('#un')).click()}
 else if(ctrl&&e.key.toLowerCase()==='y'){e.preventDefault();$('#rd').click()}
 else if(ctrl&&e.key.toLowerCase()==='a'){e.preventDefault();selAll()}
 else if(ctrl&&e.key.toLowerCase()==='d'){e.preventDefault();$('#du').click()}
 else if(e.key.startsWith('Arrow')&&sel!=null){e.preventDefault();const st=e.shiftKey?20:4;save();const dx=e.key==='ArrowLeft'?-st:e.key==='ArrowRight'?st:0,dy=e.key==='ArrowUp'?-st:e.key==='ArrowDown'?st:0;targets().forEach(q=>{if(!q.lk){q.x+=dx;q.y+=dy}});render()}
 else if(!ctrl&&!e.altKey&&e.key.toLowerCase()==='e'){sel=null;MS.clear();tool=tool==='erase'?'sel':'erase';ui();render()}
 else if(e.key==='Escape'){sel=null;tool='sel';ui();render()}});
