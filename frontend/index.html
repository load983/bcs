<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MCQ Exam" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Live MCQ Exam Platform</title>
    <meta name="description" content="PDF আপলোড করে সহজে Live MCQ পরীক্ষা তৈরি করো, লিংক শেয়ার করো, রিয়েল-টাইমে রেজাল্ট দেখো। / Create and share live MCQ exams from a PDF." />
    <meta name="theme-color" content="#0b0b0e" />
    <script>
      (() => {
        const root = document.documentElement;
        let dark = true;
        try {
          let mode = localStorage.getItem('theme-mode');
          if (!['light', 'dark', 'system'].includes(mode)) {
            const legacy = localStorage.getItem('theme');
            mode = legacy === 'light' || legacy === 'dark' ? legacy : 'dark';
          }
          dark = mode === 'system'
            ? window.matchMedia?.('(prefers-color-scheme: dark)').matches === true
            : mode === 'dark';
          const accent = localStorage.getItem('theme-accent');
          if (['coral', 'indigo', 'violet', 'sky', 'emerald', 'rose', 'amber'].includes(accent)) {
            root.dataset.accent = accent;
          }
          const background = localStorage.getItem('theme-bg-style');
          if (['minimal', 'blobs', 'dots', 'mesh'].includes(background)) {
            root.dataset.bg = background;
          }
        } catch {
          // Continue with the default dark theme if browser storage is unavailable.
        }
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
        const browserThemeColor = document.querySelector('meta[name="theme-color"]');
        if (browserThemeColor) browserThemeColor.setAttribute('content', dark ? '#0b0b0e' : '#f9fafb');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
